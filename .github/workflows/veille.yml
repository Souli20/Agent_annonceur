name: Veille opportunités

on:
  schedule:
    # Toutes les 6 heures (heure UTC) — adapte selon ta préférence
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # permet de lancer le workflow manuellement depuis GitHub

permissions:
  contents: write  # nécessaire pour committer la base sqlite mise à jour

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer l'agent
        env:
          EMAIL_ENABLED: "true"
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WHATSAPP_ENABLED: ${{ secrets.WHATSAPP_ENABLED }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: python main.py

      # La base SQLite (offres_vues.db) est normalement dans .gitignore.
      # Ce bloc la commit quand même dans le repo pour que la mémoire des
      # offres déjà envoyées survive d'un run à l'autre (les runners GitHub
      # sont éphémères). Retire ce bloc si tu préfères héberger la base
      # ailleurs (ex: un petit serveur perso).
      - name: Sauvegarder la base de déduplication
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add -f offres_vues.db
          git diff --staged --quiet || git commit -m "Mise à jour base offres vues [skip ci]"
          git push
